name: Release iota-sdk

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v3
        with:
          version: "9.15.0"
      - name: Use npm with trusted-publishing support
        run: npm install --global npm@11.5.1
      - name: Validate one release identity
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./web/sdk/package.json').version")"
          go_version="$(sed -n 's/^\s*ReleaseVersion\s*=\s*"\([^"]*\)"/\1/p' pkg/sdkidentity/identity.go)"
          test "$GITHUB_REF_NAME" = "v${package_version}"
          test "$tag_version" = "$package_version"
          test "$go_version" = "$package_version"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
      - run: pnpm install --frozen-lockfile
      - name: Verify Go release graph
        run: |
          go test ./pkg/clienthost ./pkg/sdkidentity ./pkg/lens/document
          go vet ./pkg/clienthost ./pkg/sdkidentity ./pkg/lens/...
      - name: Build and verify canonical npm package
        env:
          SDK_SOURCE_SHA: ${{ github.sha }}
        run: |
          FRONTEND_PACKAGE_VERSION="${GITHUB_REF_NAME#v}" node scripts/package-frontends.mjs artifacts/frontend
          node scripts/verify-frontend-artifacts.mjs artifacts/frontend
      - name: Publish canonical package through OIDC
        run: npm publish "artifacts/frontend/$(jq -r .file artifacts/frontend/frontend-artifacts.json)" --access public --provenance
      - name: Verify registry identity and provenance metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for attempt in {1..12}; do
            published="$(npm view "@iota-uz/sdk@${version}" --json 2>/dev/null || true)"
            if jq -e --arg version "$version" '.version == $version and .dist.integrity != null and .dist.attestations.provenance.predicateType == "https://slsa.dev/provenance/v1"' <<<"$published"; then
              exit 0
            fi
            sleep 5
          done
          echo "registry did not expose the expected version, integrity, and provenance" >&2
          exit 1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
