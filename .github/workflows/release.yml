name: Release iota-sdk

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      retry:
        description: Retry a failed candidate without a new main commit
        type: boolean
        default: false
  schedule:
    - cron: '17,47 * * * *'

concurrency:
  group: sdk-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    outputs:
      needed: ${{ steps.candidate.outputs.needed }}
      sha: ${{ steps.candidate.outputs.sha }}
      version: ${{ steps.candidate.outputs.version }}
      publish_only: ${{ steps.candidate.outputs.publish_only }}
      artifact_run: ${{ steps.candidate.outputs.artifact_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .claude/tools/go.mod
          cache-dependency-path: .claude/tools/go.sum
      - name: Select or resume the immutable candidate
        id: candidate
        working-directory: .claude/tools
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY: ${{ inputs.retry || false }}
        run: go run . sdk controller prepare --retry="$RETRY"

  verify:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true' && needs.prepare.outputs.publish_only != 'true'
    uses: ./.github/workflows/ci-full.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}

  package:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true' && needs.prepare.outputs.publish_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v3
        with:
          version: '9.15.0'
      - run: pnpm install --frozen-lockfile
      - name: Verify the production Go graph
        run: GOWORK=off go vet ./...
      - name: Build the release package at the candidate SHA
        env:
          SDK_SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          FRONTEND_PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node scripts/package-frontends.mjs artifacts/frontend
          node scripts/verify-frontend-artifacts.mjs artifacts/frontend
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-release-${{ needs.prepare.outputs.sha }}
          overwrite: true
          path: artifacts/frontend
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [prepare, verify, package]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.needed == 'true' && (needs.prepare.outputs.publish_only == 'true' || (needs.verify.result == 'success' && needs.package.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - name: Create tag publisher token
        id: publisher
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SDK_APP_ID }}
          private-key: ${{ secrets.SDK_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .claude/tools/go.mod
          cache-dependency-path: .claude/tools/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.5.1
      - uses: actions/download-artifact@v4
        with:
          name: sdk-release-${{ needs.prepare.outputs.sha }}
          path: artifacts/frontend
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.artifact_run }}
      - name: Persist publication phase before creating a public tag
        working-directory: .claude/tools
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
        run: go run . sdk controller phase "$CANDIDATE_SHA" publishing
      - name: Publish the verified artifact and complete both release identities
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node .github/scripts/publish-sdk.mjs
      - name: Mark release ready for consumers
        working-directory: .claude/tools
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
        run: go run . sdk controller phase "$CANDIDATE_SHA" ready

  record-failure:
    needs: [prepare, verify, package]
    if: always() && needs.prepare.outputs.needed == 'true' && (needs.verify.result == 'failure' || needs.package.result == 'failure' || needs.verify.result == 'cancelled' || needs.package.result == 'cancelled')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .claude/tools/go.mod
          cache-dependency-path: .claude/tools/go.sum
      - working-directory: .claude/tools
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
        run: go run . sdk controller phase "$CANDIDATE_SHA" failed
