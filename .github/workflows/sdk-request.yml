name: Request SDK release

on:
  workflow_dispatch:
    inputs:
      sdk_pr:
        description: Public SDK PR that a consumer needs
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  register:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .claude/tools/go.mod
          cache-dependency-path: .claude/tools/go.sum
      - name: Persist the public SDK PR request
        working-directory: .claude/tools
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_PR: ${{ inputs.sdk_pr }}
        run: go run . sdk controller register "$SDK_PR"
      - name: Wake the release controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main
