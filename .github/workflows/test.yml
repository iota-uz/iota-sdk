name: SDK PR checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - staging
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sdk-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-contract:
    name: Release contract and tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .claude/tools/go.mod
          cache-dependency-path: .claude/tools/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test release state transitions
        working-directory: .claude/tools
        run: |
          go test -race ./...
          go vet ./...
      - name: Validate release declaration
        if: github.event_name == 'pull_request'
        working-directory: .claude/tools
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: go run . sdk check-changes --base "$BASE_SHA"
      - name: Test publication recovery
        run: |
          node --check .github/scripts/publish-sdk.mjs
          node --check .github/scripts/restore-sdk-artifact.mjs
          node --test .github/scripts/sdk-publisher.test.mjs
      - name: Validate CI and release workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= .github/workflows/test.yml .github/workflows/ci-full.yml .github/workflows/release.yml .github/workflows/frontend-packages.yml

  changes:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      e2e: ${{ steps.filter.outputs.e2e }}
      docs: ${{ steps.filter.outputs.docs }}
      lens: ${{ steps.filter.outputs.lens }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            backend:
              - 'cmd/**'
              - 'components/**'
              - 'internal/**'
              - 'modules/**'
              - 'pkg/**'
              - 'migrations/**'
              - 'scripts/**'
              - 'styles/**'
              - 'ui/**'
              - 'tools.go'
              - 'go.mod'
              - 'go.sum'
              - 'go.work'
              - 'Justfile'
              - 'Dockerfile*'
              - 'compose*.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/scripts/**'
              - '.github/workflows/test.yml'
              - '.github/workflows/ci-full.yml'
            e2e:
              - 'e2e/**'
            docs:
              - 'docs/**'
            lens:
              - 'cmd/lens-typegen/**'
              - 'pkg/lens/document/**'
              # The palette is declared here and generated into web/lens/src/contract,
              # so a change to it has to reach the typegen drift check below.
              - 'pkg/lens/color/**'
              - 'web/lens/**'
              - 'pkg/lens/render/react/**'
              - 'go.mod'
              - 'go.sum'
              - 'Justfile'
              - '.github/workflows/test.yml'
              - '.github/workflows/ci-full.yml'

  lens-web:
    needs: changes
    if: |
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || needs.changes.outputs.lens == 'true')
    concurrency:
      group: lens-web-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    name: Lens Web
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.13"

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 9.15.0

      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: "1.46.0"

      - name: Install Client Host dependencies
        working-directory: web/client-host
        run: pnpm install --frozen-lockfile

      - name: Build Client Host
        working-directory: web/client-host
        run: pnpm build

      - name: Install Lens dependencies
        working-directory: web/lens
        run: pnpm install --frozen-lockfile

      - name: Check generated Lens types
        run: |
          just lens typegen
          git diff --exit-code -- web/lens/src/contract

      - name: Verify clean-clone Go compatibility boundary
        run: |
          test "$(git ls-files pkg/lens/render/react/dist)" = "pkg/lens/render/react/dist/.keep"
          test ! -f pkg/lens/render/react/dist/.vite/manifest.json
          go test ./pkg/lens/render/react

      - name: Build ignored Lens compatibility assets
        run: just lens build

      - name: Check Lens workspace
        run: just lens check

      - name: Verify Lens compatibility bundle builds
        run: |
          test -f pkg/lens/render/react/dist/.vite/manifest.json
          git diff --exit-code -- pkg/lens/render/react/dist/.keep

  security-gosec:
    needs: changes
    if: |
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || needs.changes.outputs.backend == 'true')
    concurrency:
      group: security-scan-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    name: Security Scan (gosec)

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.13"

      - name: Download Go dependencies
        run: go mod download

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.2

      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: "1.46.0"

      - name: Run gosec (production entrypoints)
        run: just gosec

  lint-and-format:
    needs: changes
    if: |
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || needs.changes.outputs.backend == 'true')
    concurrency:
      group: lint-and-format-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: Code Quality & Formatting

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.13"

      - name: Install golangci-lint
        run: |
          if ! command -v golangci-lint >/dev/null; then
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
          fi
          golangci-lint version

      - name: Install templ
        run: |
          go install github.com/a-h/templ/cmd/templ@v0.3.857
          templ --help

      - name: Install air
        run: |
          go install github.com/air-verse/air@latest
          air -v

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 9.15.0

      - name: Install pg_formatter for SQL formatting
        run: |
          sudo apt-get update
          sudo apt-get install -y pgformatter

      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: "1.46.0"

      - name: Download Go dependencies
        run: go mod download

      - name: Install applet CLI
        run: go install github.com/iota-uz/applets/cmd/applet@latest

      - name: Test generated files are up to date
        run: |
          just generate
          git diff --exit-code

      - name: Check translation files
        run: just check tr

      - name: Enforce applet SDK dependency policy
        run: just applet deps-check

      - name: Check templ files formatting
        run: |
          templ fmt .
          if [ -n "$(git diff --name-only)" ]; then
            echo "Error: Some templ files are not properly formatted"
            git diff
            exit 1
          fi
          echo "All templ files are properly formatted"

      - name: Check Go files formatting
        run: |
          go fmt ./...
          if [ -n "$(git diff --name-only)" ]; then
            echo "Error: Some Go files are not properly formatted"
            git diff
            exit 1
          fi
          echo "All Go files are properly formatted"

      - name: Check SQL files formatting
        run: |
          mkdir -p /tmp/formatted
          find modules -name "*.sql" -type f | while read -r sqlfile; do
            pg_format "$sqlfile" > "/tmp/formatted/$(basename "$sqlfile")"
            if ! diff -q "$sqlfile" "/tmp/formatted/$(basename "$sqlfile")" > /dev/null; then
              echo "Error: $sqlfile is not properly formatted"
              diff "$sqlfile" "/tmp/formatted/$(basename "$sqlfile")"
              exit 1
            fi
          done
          echo "All SQL files are properly formatted"

      - name: Run go vet
        run: go vet -tags dev ./...

      - name: Run service-free Go contract tests
        run: go test ./pkg/sdkidentity ./pkg/mapping

      - name: Check applet RPC contracts
        run: just applet rpc-check bichat

      - name: Install root dependencies (for Tailwind CSS)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install BiChat applet dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace -C modules/bichat/presentation/web

      - name: Run applet DX guardrails
        run: |
          applet doctor

      - name: Typecheck BiChat applet
        run: pnpm -C modules/bichat/presentation/web exec tsc --noEmit

      - name: Generate CSS files
        run: just css

      - name: Run golangci-lint (unused variables/functions)
        run: just check lint

  docs-build:
    needs: changes
    if: |
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || needs.changes.outputs.docs == 'true')
    concurrency:
      group: docs-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    name: Documentation Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 9.15.0

      - name: Install documentation dependencies
        working-directory: ./docs
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Validate Mermaid diagrams
        working-directory: ./docs
        run: pnpm run check:mermaid

      - name: Build documentation
        working-directory: ./docs
        run: pnpm build

      - name: Check documentation build artifacts
        run: |
          if [ ! -d "docs/out" ]; then
            echo "Error: Documentation build output not found"
            exit 1
          fi
          if [ ! -f "docs/out/index.html" ]; then
            echo "Error: Documentation index.html not found"
            exit 1
          fi
          echo "Documentation build successful"
