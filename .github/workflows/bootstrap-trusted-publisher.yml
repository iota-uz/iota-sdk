name: Bootstrap npm trusted publisher

on:
  push:
    branches: [codex/canonical-frontend-distribution]
    paths: [.github/workflows/bootstrap-trusted-publisher.yml]

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.15.0"
          registry-url: https://registry.npmjs.org
      - name: Configure and verify GitHub Actions trust
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install --global npm@12.0.2
          npm trust github @iota-uz/sdk \
            --file release.yml \
            --repo iota-uz/iota-sdk \
            --allow-publish \
            --yes
          npm trust list @iota-uz/sdk
