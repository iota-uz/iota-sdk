type InventoryPosition {
    id: ID!
    title: String!
    tags: [String!]!
}

input InventoryItem {
    positionId: ID!
    found: Int!
}

extend type Query {
    inventory: [InventoryPosition!]! @authenticated
}

extend type Mutation {
    completeInventoryCheck(items: [InventoryItem!]!): Boolean! @authenticated
}
