type Session {
    token: String!
    userId: ID!
    ip: String!
    userAgent: String!
    expiresAt: Time!
    createdAt: Time!
}

extend type Mutation {
    authenticate(email: String!, password: String!): Session! @public
    googleAuthenticate: String! @public

    deleteSession(token: String!): Boolean! @authenticated
}

extend type Subscription {
    sessionDeleted: ID! @authenticated
}