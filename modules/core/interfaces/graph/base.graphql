scalar Time
scalar Int64

"""Field is reachable without a session."""
directive @public on FIELD_DEFINITION
"""Field requires an authenticated caller."""
directive @authenticated on FIELD_DEFINITION
"""Field requires an authenticated caller that holds every listed permission."""
directive @can(permissions: [String!]!) on FIELD_DEFINITION

directive @goModel(
    model: String
    models: [String!]
) on OBJECT | INPUT_OBJECT | SCALAR | ENUM | INTERFACE | UNION

directive @goEnum(
    value: String
) on ENUM_VALUE

type Query {
    hello(name: String): String @public
}

type Mutation {
    add(a: Int!, b: Int!): Int! @public
}

type Subscription {
    counter: Int! @public
}
